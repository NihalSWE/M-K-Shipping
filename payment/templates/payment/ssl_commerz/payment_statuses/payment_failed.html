<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | Marine Travel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ocean-deep: #003049;
            --ocean-blue: #0077B6;
            --error-red: #ef4444;
            --foam: #CAF0F8;
            --white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0077B6 0%, #003049 100%);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 90%;
            z-index: 10;
        }

        .status-icon {
            width: 70px; height: 70px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            border: 2px solid var(--error-red);
        }

        .status-icon svg { fill: var(--error-red); }

        h2 { color: var(--white); margin: 0 0 1rem 0; font-weight: 700; }
        p { color: var(--foam); opacity: 0.8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }

        .btn {
            display: inline-block;
            background: var(--white);
            color: var(--ocean-deep);
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn:hover { transform: translateY(-2px); background: var(--foam); }

        /* Wave Animation */
        .waves { position: absolute; bottom: 0; width: 100%; height: 15vh; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; fill: rgba(255,255,255,0.3); }
        .parallax > use:nth-child(2) { animation-delay: -3s; fill: rgba(255,255,255,0.1); }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-icon">
            <svg width="35" height="35" viewBox="0 0 24 24">
                <path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16" />
            </svg>
        </div>
        <h2>Payment Failed</h2>
        <p>Something went wrong with your transaction. Your seat holds have been released. Please try booking again.</p>
        <a href="{% url 'home' %}" class="btn">Return to Home</a>
    </div>

    <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
        <defs><path id="w" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
        <g class="parallax"><use href="#w" x="48" y="0" /><use href="#w" x="48" y="5" /></g>
    </svg>
</body>
</html>
